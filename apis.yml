name: Constelli
description: >-
  Constelli (Constelli Signals Private Limited) is a Hyderabad, India based defence
  and aerospace signal-processing company founded in 2017 by Satya Gopal Panigrahi and
  Avinash Chenreddy. It designs and manufactures radar systems, radar target and echo
  simulators, deployable drone-based radar payloads, high-performance radar processors,
  and IRIG-standard digital telemetry receivers for ground, onboard, and satellite
  telemetry. Its products serve electronic warfare and defence R&D programs globally,
  including India's Ministry of Defence and DRDO. Constelli raised a $20M Series A led
  by General Catalyst (with Pravega Ventures and 360 One). It is a hardware/systems
  company and does not currently publish a public developer API, portal, or SDKs.
